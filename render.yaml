# Render Blueprint for the FastAPI backend. Frontend deploys to Vercel (root directory: frontend).
services:
  - type: web
    name: fireflies-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite:///./fireflies.db
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: ANTHROPIC_API_KEY
        sync: false   # optional — enables Claude-generated summaries and answers
